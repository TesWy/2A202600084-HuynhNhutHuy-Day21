name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - ".dvc/**"
      - "src/**.py"
      - "tests/**.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  MIN_ACCURACY: "0.70"
  MODEL_KEY: "models/latest/model.pkl"
  METRICS_KEY: "models/latest/metrics.json"
  REPORT_KEY: "models/latest/report.txt"

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      previous_accuracy: ${{ steps.previous_metrics.outputs.previous_accuracy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS environment
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> "$GITHUB_ENV"
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> "$GITHUB_ENV"
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> "$GITHUB_ENV"
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MLFLOW_EXPERIMENT_NAME=${{ secrets.MLFLOW_EXPERIMENT_NAME }}" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
          cat outputs/metrics.json

      - name: Read previous production metrics
        id: previous_metrics
        run: |
          python - <<'EOF'
          import json
          import os
          import boto3
          from botocore.exceptions import ClientError

          bucket = os.environ["S3_BUCKET"]
          key = os.environ["METRICS_KEY"]
          output_path = os.environ["GITHUB_OUTPUT"]
          previous_accuracy = ""

          try:
              obj = boto3.client("s3").get_object(Bucket=bucket, Key=key)
              previous_accuracy = str(json.loads(obj["Body"].read())["accuracy"])
              print(f"Previous production accuracy: {previous_accuracy}")
          except ClientError as exc:
              code = exc.response.get("Error", {}).get("Code")
              if code in {"NoSuchKey", "404"}:
                  print("No previous production metrics found.")
              else:
                  raise

          with open(output_path, "a", encoding="utf-8") as f:
              f.write(f"previous_accuracy={previous_accuracy}\n")
          EOF

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.pkl
            outputs/metrics.json
            outputs/report.txt

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gates
        run: |
          python - <<'EOF'
          min_accuracy = float("${{ env.MIN_ACCURACY }}")
          accuracy = float("${{ needs.train.outputs.accuracy }}")
          previous_raw = "${{ needs.train.outputs.previous_accuracy }}"

          print(f"New accuracy: {accuracy:.4f}")
          print(f"Minimum accuracy: {min_accuracy:.4f}")

          if accuracy < min_accuracy:
              raise SystemExit(f"FAILED: accuracy {accuracy:.4f} < {min_accuracy:.4f}")

          if previous_raw.strip():
              previous_accuracy = float(previous_raw)
              print(f"Previous production accuracy: {previous_accuracy:.4f}")
              if accuracy < previous_accuracy:
                  raise SystemExit(
                      f"FAILED: accuracy {accuracy:.4f} < previous {previous_accuracy:.4f}"
                  )

          print("PASSED: quality gates allow deployment.")
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AWS SDK
        run: pip install boto3==1.34.103

      - uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Configure AWS environment
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> "$GITHUB_ENV"

      - name: Publish model to S3
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["S3_BUCKET"]
          s3 = boto3.client("s3")
          uploads = [
              ("models/model.pkl", os.environ["MODEL_KEY"]),
              ("outputs/metrics.json", os.environ["METRICS_KEY"]),
              ("outputs/report.txt", os.environ["REPORT_KEY"]),
          ]

          for local_path, key in uploads:
              s3.upload_file(local_path, bucket, key)
              print(f"Uploaded {local_path} to s3://{bucket}/{key}")
          EOF

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
